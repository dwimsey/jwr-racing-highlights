name: Build site (decode media) and publish to gh-pages
on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site with binary media
        run: |
          set -e
          mkdir -p _site
          cp -r site/. _site/
          cat media-b64/media2.tar.b64.* | base64 -d > media.tar
          sha256sum media.tar
          tar -C _site -xf media.tar
          touch _site/.nojekyll
          find _site -type f | wc -l
          du -sh _site
      - name: Publish to gh-pages branch
        run: |
          set -e
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish site from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
